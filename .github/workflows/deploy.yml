name: Deploy Portfolio

on:
  push:
    branches:
      - main

# Queue deploys instead of cancelling: a cancel mid `compose up` can leave the site down.
concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The job's own short-lived token; needs this repo granted access to the GHCR package.
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build Docker image
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Push Docker image to GHCR
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # The GHCR package is public, so the server pulls without credentials.
      # The checkout pulls with its own read-only deploy key (core.sshCommand): no token in the remote URL.
      # fingerprint pins the VPS host key: a spoofed server fails the deploy instead of receiving it.
      # Runs the exact commit and image of this run; old sha tags are removed so they don't pile up on disk.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -e
            cd /home/rokev-dynamics/portfolio
            git fetch origin main
            git reset --hard ${{ github.sha }}
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull --quiet
            docker compose up -d
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep '^${{ env.IMAGE }}:' | grep -v -e ':${{ github.sha }}$' -e ':latest$' \
              | xargs -r docker rmi
            docker image prune -f

      # First healthcheck can take up to 30s on Docker engines older than 25; poll for 60s.
      - name: Verify deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            for i in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' portfolio)
              [ "$status" = "healthy" ] && echo "healthy" && exit 0
              sleep 1
            done
            echo "portfolio not healthy: $status"
            exit 1
