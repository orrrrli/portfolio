# Serves the React Router prerender output (build/client).
# The host nginx terminates TLS and proxies to 127.0.0.1:3006.
server {
    listen 3006;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a proxy: never emit redirects with the container's host/port.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml text/xml image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # Empty types{} so default_type wins over the built-in .xml -> text/xml mapping.
    location ~ ^(/es)?/rss\.xml$ {
        types { }
        default_type application/rss+xml;
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images keep their names across deploys, so cache for a week, not forever.
    location /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # "/es" and "/work/axiriam" map to their prerendered index.html with no trailing-slash
    # redirect, so the canonical URLs (no trailing slash) are served directly.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Unknown paths: real 404 status, rendered by the SPA shell.
    error_page 404 /__spa-fallback.html;
}
