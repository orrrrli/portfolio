services:
  portfolio:
    # The deploy sets IMAGE_TAG to the commit sha; a manual `compose up` without it runs :latest.
    # Rollback: IMAGE_TAG=<older sha> docker compose up -d
    image: ghcr.io/orrrrli/portfolio:${IMAGE_TAG:-latest}
    container_name: portfolio
    ports:
      - "127.0.0.1:3006:3006"
    restart: unless-stopped
